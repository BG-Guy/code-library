<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Library — web dev snippets worth reading</title>
  <meta name="description" content="A bright, browsable library of full-stack web development snippets — vanilla JavaScript, Node.js, and Tailwind CSS. Click a card to read the code, copy it, and see exactly how it works." />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="headerRoot"></div>
  <div id="menuRoot"></div>

  <div class="body-content">
    <main>
      <section class="hero">
        <span class="hero-eyebrow">✨ 12 snippets and counting</span>
        <h1>A little library of <span class="gradient-text">good code</span></h1>
        <p class="lead">Full-stack web development snippets in vanilla JavaScript, Node.js and Tailwind CSS. Click a card to read it, copy it, and understand exactly how it works.</p>

        <div class="controls">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" id="searchInput" placeholder="Search snippets — try “debounce”, “express”, “dark mode”…" aria-label="Search snippets" />
          </div>

          <div class="filter-pills" role="group" aria-label="Filter by language">
            <button class="pill is-active" data-filter="all"><span class="dot dot-all"></span>All</button>
            <button class="pill" data-filter="javascript"><span class="dot dot-javascript"></span>JavaScript</button>
            <button class="pill" data-filter="node"><span class="dot dot-node"></span>Node.js</button>
            <button class="pill" data-filter="tailwind"><span class="dot dot-tailwind"></span>Tailwind CSS</button>
          </div>
        </div>
      </section>

      <section class="grid-section">
        <div class="card-grid" id="cardGrid"></div>
        <div class="empty-state" id="emptyState">
          <h3>No snippets match your search</h3>
          <p>Try a different keyword or clear the filter.</p>
        </div>
      </section>
    </main>
  </div>

  <div id="footerRoot"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
